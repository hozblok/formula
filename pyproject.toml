[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10,<3"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
# Skip patterns:
# - *-musllinux_*: Alpine/musl Linux. Boost's nested cpp_bin_float<N> variant
#   templates (18 precisions x variant visitors) blow compiler memory even
#   with clang. Alpine users can `pip install --no-binary formula` to build
#   from the sdist instead.
# CPython Windows x86 (cp*-win32) IS built.
skip = "*-musllinux_*"
build-verbosity = 1
test-requires = ["pytest"]
test-command = "python -m pytest --verbose {project}/tests"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
archs = ["AMD64", "x86"]
