[build-system]
requires = ["setuptools>=61", "wheel", "pybind11>=2.10,<3"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-*"
# Skip patterns:
# - *-musllinux_*: Alpine/musl Linux. Boost's nested cpp_bin_float<N> variant
#   templates (18 precisions x variant visitors) blow compiler memory even
#   with clang. Alpine users can `pip install --no-binary formula` to build
#   from the sdist instead.
skip = "*-musllinux_*"
build-verbosity = 1
test-extras = ["test"]
test-command = "python -m pytest --verbose {project}/tests"

[tool.cibuildwheel.macos]
# arm64 only: finufft publishes no macOS x86_64 wheel, so the tests cannot run there.
archs = ["arm64"]
# 13.3 is the libc++ floor for the float std::to_chars in cstrace.hpp.
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.windows]
# 64-bit only: the tests need scipy and finufft, which ship no 32-bit wheels.
archs = ["AMD64"]
